# DesktopInfo Configuration
# Single-column layout with manually aligned fixed-size charts

[options]

top=50
right=50
transparency=30
width=360
column1width=0

font-face=Consolas
font-size=10
line-spacing=0

[text]
noresults=<n/a>
error=[error]
null-result=<null>
unknown=Unknown
executing=<executing>
menu-export=Export
menu-ini=Select Config
menu-reload=Reload
menu-configuration=Edit Configuration
menu-log=Open Log File
menu-manual=Read Manual
menu-wmode=Start W Mode
menu-about=About Desktop Info
menu-quit=Quit

[items]

# colors
set=key:White,value:#ffffff
set=key:Grey,value:#a0a0a0
set=key:Cyan,value:#00ffff
set=key:Magenta,value:#ff00ff
set=key:Green,value:#00ff00
set=key:Orange,value:#ffb871
set=key:Silver,value:#c0c0c0
set=key:Blue,value:#0000f0
set=key:Red,value:#ff0000

COLOR=%White%

# battery status lookup table
set=key:battery1,value:discharging
set=key:battery2,value:charging
set=key:battery3,value:charged

# date and time
DATETIME=text:,style:b,interval:30,font-size:18,display:%5[1.0a]:%6[2.0d]%5[2.0p],align:c
DATETIME=text:,style:b,interval:60,font-size:10,display:%1[dddd],align:c
DATETIME=text:,style:b,interval:60,font-size:10,display:%2 %3[mmmm] %4[yyyy],align:c

COMMENT

Last Logon sign in method
set=key:logon{D6886603-9D2F-4EB2-B667-1971041FA96B},value:Hello (PIN)
set=key:logon{8AF662BF-65A0-4D0A-A540-A338A999D36F},value:Hello (face)
set=key:logon{BEC09223-B018-416D-A0AC-523971B639F5},value:Hello (fingerprint)
set=key:logon{60B78E88-EAD8-445C-9CFD-0B87F74EA6CD},value:Password
set=key:logon{27FBDB57-B613-4AF2-9D7E-4FA7A66C21AD},value:Trusted signal
set=key:logon{F8A1793B-7873-4046-B2A7-1F318747F427},value:FIDO key
set=key:logon{25CA8579-1BD8-469c-B9FC-6AC45A161C18},value:Password

# Host Details
REG=value:HKEY_LOCAL_MACHINE\SOFTWARE\Microsoft\Windows NT\CurrentVersion\UBR,set:ubr,hidden:1
REG=value:HKEY_LOCAL_MACHINE\SOFTWARE\Microsoft\Windows NT\CurrentVersion\DisplayVersion,set:displayversion,hidden:1
REG=value:HKEY_LOCAL_MACHINE\SOFTWARE\Microsoft\Windows\CurrentVersion\Authentication\LogonUI\LastLoggedOnProvider,set:logonprovider,hidden:1

TEXT=color:%Orange%,text:,display:HOST DETAILS,style:bu
TEXT=text:,display:Last Logon: %logon%logonprovider%%
WMI=text:,interval:5,namespace:root\cimv2,query:Win32_ComputerSystem,display:Hostname:   %Name%,style:b
WMI=text:,interval:5,namespace:root\cimv2,query:Win32_BIOS,display:Serial:     %SerialNumber%
WMI=text:,interval:5,namespace:root\cimv2,query:Win32_ComputerSystem,display:System:     %Manufacturer% - %Model%
WMI=text:,interval:0,namespace:root\cimv2,query:Win32_OperatingSystem,display:OS:         %caption%
WMI=text:,interval:0,namespace:root\cimv2,query:Win32_OperatingSystem,display:OS Build:   %displayversion%
WMI=text:,interval:0,namespace:root\cimv2,query:Win32_OperatingSystem,display:Version:    %version%.%ubr%

COMMENT

# Battery Status
TEXT=color:%Orange%,text:,display:BATTERY STATUS,style:bu
UPTIME=text:,interval:30,display:Uptime:     %2 hours %3 minutes
WMI=text:,interval:30,hide-no-result:1,namespace:root\cimv2,query:Win32_Battery,chart:bar2 scale:linear max:100 series1:15 threshold:40 color1:%Red% color2:%Orange% color3:%Green%,display:Battery:    %EstimatedChargeRemaining%% %battery%BatteryStatus%%     %chart%

COMMENT

# CPU
REG=value:HKEY_LOCAL_MACHINE\HARDWARE\DESCRIPTION\System\CentralProcessor\0\ProcessorNameString,set:cpu,hidden:1

TEXT=color:%Orange%,text:,display:CPU DETAILS,style:bu
WMI=text:,interval:5,namespace:root\cimv2,query:Win32_Processor,display:CPU:        %Name%
WMI=text:,interval:5,namespace:root\cimv2,query:Win32_Processor,display:Cores:      %NumberOfCores%
WMI=text:,interval:5,namespace:root\cimv2,query:Win32_Processor,display:Logical:    %NumberOfLogicalProcessors%
WMI=text:,interval:5,namespace:root\cimv2,query:Win32_Processor,display:Speed:      %CurrentClockSpeed%[4.2K]GHz
PROCESSCOUNT=text:,interval:5,display:Processes:  %1 Threads: %2
TOPPROCESSCPU=text:,interval:10,maxrows:1,display:Top CPU:    %3[3.1g]GB %1

COMMENT

# Memory
TEXT=color:%Orange%,text:,display:MEMORY USED,style:bu
PHYSICALRAM=text:,interval:5,alarms:(%3 ge 85 0000FF),display:RAM:        %1[3.1g]GB of %2[1.0b]B - %3% Used
PAGEFILE=text:,interval:5,display:Pagefile:   %1[3.1g]GB of %2[3.1g]GB - %3% Used
TOPPROCESSMEM=text:,interval:5,counter:pu,maxrows:1,display:Top RAM:    %3[3.1g]GB %1

COMMENT

# Storage
TEXT=color:%Orange%,text:,display:STORAGE USED,style:bu
LOGICALDRIVES=text:,interval:15,diskio:1,chart:bar2 scale:linear max:100 series1:7 threshold:80 color1:%Green% color2:%Orange% color3:%Red%,alarms:(%11 ge 10000000 0000f0)(%13 ge 10000000 0000f0)(%7 ge 90 0070f0),display:%1:          %6[5.1g] of %5[3.0g]GB     %chart%

COMMENT

# Network
TEXT=color:%Orange%,text:,display:NETWORK,style:bu
NETWORKINTERFACES=text:,interval:30,operstatus:1,iftype:6 71,display:Adapter:     %2: %8/%10
WMI=text:,interval:60,alarms:(%11 ge 34 0088f0),namespace:root\cimv2,query:Win32_PingStatus where address='8.8.8.8',display:Latency:     %ResponseTime%ms from 8.8.8.8
NETCONNECTIONS=text:,interval:5,display:Connections: %1